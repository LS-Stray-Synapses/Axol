[project]
name = "axol"
version = "0.0.1"
description = "A self-adapting agent architecture with its own harness."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Loose ranges here; exact pins live in requirements.txt.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "mcp>=2.3.0",
    "openai>=3.46.0",
    "pydantic>=2.14.3"
]

[tool.pytest.ini_options]
# Tests live in tests/; the repo root goes on the import path so
# `from modules.settings import ...` works no matter where pytest starts.
testpaths = ["tests"]
pythonpath = ["."]
